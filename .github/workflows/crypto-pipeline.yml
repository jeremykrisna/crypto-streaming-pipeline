name: Crypto Streaming Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: redpandadata/redpanda:v24.1.1
        options: >-
          --health-cmd "rpk cluster info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9092:9092
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      
      - name: Run Producer
        run: cd src && timeout 30 python producer.py
      
      - name: Run Consumer
        run: cd src && timeout 20 python consumer.py
      
      - name: Run Query
        run: cd src && python query.py