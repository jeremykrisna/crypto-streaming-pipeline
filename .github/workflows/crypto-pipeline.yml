name: Crypto Streaming Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: redpandadata/redpanda:v24.1.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      
      - name: Wait for Redpanda
        run: sleep 15
      
      - name: Run Producer
        env:
          REDPANDA_BROKER: localhost:9092
        run: cd src && timeout 60 python producer.py
      
      - name: Run Consumer
        env:
          REDPANDA_BROKER: localhost:9092
        run: cd src && timeout 20 python consumer.py
      
      - name: Run Query
        run: cd src && python query.py