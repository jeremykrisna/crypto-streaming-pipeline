version: '3.8'

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda-broker
    ports:
      - "9092:9092"   
      - "29092:29092" 
      - "8081:8081"   
      - "9644:9644"   
    environment:
      REDPANDA_ADVERTISED_ADDRESSES: localhost:9092
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    healthcheck:
      test: rpk cluster info
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /etc/prometheus/prometheus.yml <<'EOF'
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          - job_name: 'redpanda'
            static_configs:
              - targets: ['redpanda:9644']
        EOF
        /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    networks:
      - streaming-network
    depends_on:
      - redpanda

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - streaming-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  streaming-network:
    driver: bridge
